<div class="auth-screen forgot-screen">
  <div class="auth-screen__container">

    <!-- Back arrow -->
    <button class="forgot-screen__back icon-btn" (click)="goBack()" type="button">
      <span class="material-symbols-outlined">arrow_back</span>
    </button>

    <!-- Logo & Header -->
    <div class="auth-screen__header">
      <div class="auth-logo">
        <img src="/logo-long.png" alt="EasyArena" class="auth-logo__img">
      </div>
      <h1 class="auth-screen__title">Mot de passe oublié</h1>
      <p class="auth-screen__subtitle">
        Entrez votre numéro de téléphone pour recevoir un code de réinitialisation
      </p>
    </div>

    <!-- Success State -->
    <div *ngIf="successState()" class="forgot-success">
      <div class="forgot-success__icon-wrap">
        <span class="material-symbols-outlined forgot-success__icon">check_circle</span>
      </div>
      <h3 class="forgot-success__title">Code envoyé !</h3>
      <p class="forgot-success__message">
        Un code a été envoyé au <strong>{{ phone() }}</strong>
      </p>
      <button class="btn btn--primary btn--full forgot-success__btn" (click)="verifyCode()">
        Vérifier le code
      </button>
      <a routerLink="/login" class="forgot-screen__back-link">Retour à la connexion</a>
    </div>

    <!-- Form State -->
    <form *ngIf="!successState()" class="auth-form" (ngSubmit)="onSubmit()" novalidate>

      <!-- Error message -->
      <div *ngIf="errorMessage()" class="auth-form__error">
        <span class="material-symbols-outlined">error</span>
        {{ errorMessage() }}
      </div>

      <!-- Phone field -->
      <div class="form-group">
        <label class="form-label">Numéro de téléphone</label>
        <app-phone-input [ngModel]="phone()" (ngModelChange)="phone.set($event)" name="phone"></app-phone-input>
      </div>

      <!-- Submit button -->
      <button
        type="submit"
        class="btn btn--primary btn--full forgot-submit-btn"
        [class.loading]="loading()"
        [disabled]="loading()">
        <span *ngIf="!loading()">Envoyer le code</span>
        <span *ngIf="loading()" class="loading-spinner"></span>
      </button>

      <!-- Back to login link -->
      <p class="auth-form__footer">
        <a routerLink="/login" class="auth-form__link">Retour à la connexion</a>
      </p>

    </form>
  </div>
</div>
